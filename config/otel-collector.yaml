# The fork in the road: traces + logs -> Data Prepper -> OpenSearch,
# metrics -> Prometheus (native OTLP receiver).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    timeout: 5s

exporters:
  otlp_grpc/data-prepper:
    endpoint: data-prepper:21890
    tls: { insecure: true }
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/data-prepper]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/data-prepper]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prometheus]
