global:
  scrape_interval: 15s
  evaluation_interval: 15s

# OTLP metrics arrive by push, not scrape. Copy these resource attributes onto
# every series so PromQL can filter by service, the same key OpenSearch uses.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 10m   # Data Prepper's windowed APM metrics can arrive late

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
